name: Scheduled Dear Lottery Ingestion Pipeline

on:
  schedule:
    # 1:00 PM to 1:45 PM IST  = 07:30 to 08:15 UTC
    # 6:00 PM to 6:45 PM IST  = 12:30 to 13:15 UTC
    # 8:00 PM to 8:45 PM IST  = 14:30 to 15:15 UTC
    - cron: '30,35,40,45,50,55 7,12,14 * * *'
    - cron: '0,5,10,15 8,13,15 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Draw time slot (1PM, 6PM, 8PM)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - '1PM'
          - '6PM'
          - '8PM'
      date:
        description: 'Draw date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          npm install
          cd web && npm install

      - name: Execute Autonomous Live Poller
        env:
          WORKER_API_URL: ${{ secrets.WORKER_API_URL || 'https://api.dearresultlive.in/api/results' }}
          WORKER_API_KEY: ${{ secrets.WORKER_API_KEY || 'dear_lottery_secret_key_prod_2026' }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8838063468:AAEJ3qJsSDsf1WB-kJA35Iy3rw0lwKhBPYg' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@dearresultlive' }}
        run: |
          SLOT_ARG=""
          if [ "${{ github.event.inputs.slot }}" != "" ] && [ "${{ github.event.inputs.slot }}" != "auto" ]; then
            SLOT_ARG="--slot ${{ github.event.inputs.slot }}"
          fi

          DATE_ARG=""
          if [ "${{ github.event.inputs.date }}" != "" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi

          echo "Running autonomous poller: $SLOT_ARG $DATE_ARG"
          node scripts/live_autopoller.js $SLOT_ARG $DATE_ARG

      - name: Commit and Push Verified Results to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/data/live_draws.json web/public/results/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update official draw results" && git push)

      - name: Instant IndexNow & Search Engine Ping
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/seo_pinger.js

      - name: Build Astro Frontend
        run: |
          cd web
          npm run build

      - name: Deploy Frontend to Cloudflare Pages
        if: success()
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'web'
          command: 'pages deploy dist --project-name=dear-lottery-web'

      - name: Verify Health & Artifacts
        if: always()
        run: |
          echo "Autonomous pipeline run completed at $(date -u)"
