name = "dear-lottery-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "b80646cca3cd608739aab95124ecc718"
workers_dev = true
send_metrics = false

[vars]
API_KEY = "dear_lottery_secret_key_prod_2026"
ENVIRONMENT = "production"
FRONTEND_URL = "https://dearresultlive.in"
INDEXNOW_KEY = "dearlotteryindexnowkey2026"
ONESIGNAL_APP_ID = "7ede11f8-0188-4e67-88b0-d3947320982a"
ONESIGNAL_REST_KEY = "YOUR_ONESIGNAL_REST_API_KEY"
TELEGRAM_BOT_TOKEN = "8838063468:AAEJ3qJsSDsf1WB-kJA35Iy3rw0lwKhBPYg"
TELEGRAM_CHAT_ID = "@dearresultlive"

[[d1_databases]]
binding = "DB"
database_name = "dear_lottery_db"
