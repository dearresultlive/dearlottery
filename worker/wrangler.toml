# Optional R2 bucket for raw PDF/Image storage (uncomment once R2 is enabled in Cloudflare Dashboard)
# [[r2_buckets]]
# binding = "RESULTS_BUCKET"
# bucket_name = "dear-lottery-archives"

[triggers]
# 1. Warm-up pre-publish: 12:30 PM, 5:30 PM, 7:30 PM IST (07:00, 12:00, 14:00 UTC)
# 2. Live poller every 2 min: 1:06-1:28 PM, 6:06-6:28 PM, 8:06-8:28 PM IST (07:36-07:58, 12:36-12:58, 14:36-14:58 UTC)
# 3. Backup window: 1:30-1:45 PM, 6:30-6:45 PM, 8:30-8:45 PM IST (08:00-08:15, 13:00-13:15, 15:00-15:15 UTC)
crons = [
  "0 7,12,14 * * *",
  "36,38,40,42,44,46,48,50,52,54,56,58 7,12,14 * * *",
  "0,5,10,15 8,13,15 * * *"
]
